<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Help Nuri Avoid Walking</title>

<style>
:root{
--bg:#0b0b10;
--panel:rgba(0,0,0,.62);
--text:rgba(255,255,255,.94);
--danger:rgba(255,80,80,.95);
--barbg:rgba(255,255,255,.14);
--card:rgba(255,255,255,.10);
--cardUp:rgba(255,255,255,.18);
--stroke:rgba(255,255,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui;}

#stage{position:fixed;inset:0;}
#road{position:absolute;left:0;right:0;bottom:0;height:28vh;background:#1b1b22;border-top:24px solid rgba(255,255,255,.08);}
#dashes{position:absolute;left:0;right:0;top:45%;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 52px,transparent 52px 98px);}

#uiTop{position:fixed;top:14px;left:14px;right:14px;z-index:50;}
#title{color:white;font-weight:900;font-size:clamp(20px,6vw,40px);margin-bottom:10px;}
#bar{height:12px;background:var(--barbg);border-radius:999px;overflow:hidden;}
#barFill{height:100%;width:100%;background:var(--danger);border-radius:999px;transition:width .15s;}

#dialogue{
position:fixed;
left:50%;
transform:translateX(-50%);
top:100px;
width:min(600px,92vw);
background:var(--panel);
color:white;
border-radius:18px;
padding:14px;
z-index:60;
text-align:center;
display:none;
}
#dLine1{font-weight:900;font-size:18px;}
#dLine2{margin-top:8px;font-weight:800;}

#hint{
position:fixed;
left:50%;
transform:translateX(-50%);
bottom:20px;
width:min(560px,92vw);
background:rgba(0,0,0,.55);
color:white;
border-radius:18px;
padding:10px;
font-size:13px;
text-align:center;
z-index:55;
}

#chars{position:absolute;inset:0;z-index:20;}
.char{position:absolute;bottom:18vh;width:42vw;max-width:240px;}
#nuri{left:6vw;}
#sadith{right:6vw;}
.sprite{width:100%;aspect-ratio:1;background-repeat:no-repeat;background-size:300% 100%;}

#puzzleOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:80;}
#puzzlePanel{position:absolute;left:50%;transform:translateX(-50%);top:22vh;width:min(520px,94vw);background:rgba(0,0,0,.7);border-radius:22px;padding:14px;}
#grid{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.tile{
appearance:none;border:none;background:var(--card);border:2px solid var(--stroke);
border-radius:16px;height:64px;font-size:28px;font-weight:900;color:white;
display:flex;align-items:center;justify-content:center;
}
.tile.up{background:var(--cardUp);}
.tile.matched{background:rgba(120,255,160,.2);}

#rickshawPrompt{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:85;}
#rBox{position:absolute;left:50%;transform:translateX(-50%);top:30vh;width:min(520px,92vw);background:rgba(0,0,0,.75);color:white;border-radius:22px;padding:16px;text-align:center;}
</style>
</head>

<body>
<div id="stage">
<div id="chars">
<div class="char" id="nuri"><div class="sprite" id="nuriSprite"></div></div>
<div class="char" id="sadith"><div class="sprite" id="sadithSprite"></div></div>
</div>
<div id="road"><div id="dashes"></div></div>
</div>

<div id="uiTop">
<div id="title">Help Nuri Avoid Walking</div>
<div id="bar"><div id="barFill"></div></div>
</div>

<div id="dialogue">
<div id="dLine1"></div>
<div id="dLine2"></div>
</div>

<div id="hint">Tap to advance dialogues • Match fruits to unlock rickshaw 🚲</div>

<div id="puzzleOverlay">
<div id="puzzlePanel">
<div id="movesText">Moves left: 16</div>
<div id="grid"></div>
</div>
</div>

<div id="rickshawPrompt">
<div id="rBox">
<div>Rickshaw unlocked! 🔔🚲</div>
<div>Tap anywhere to take rickshaw</div>
</div>
</div>

<script>
const MOVE_LIMIT=16;          // Easier
const MISMATCH_PENALTY=0.08;  // Easier
const GRAPE_BOOST=0.08;       // Easier

let stamina=1;
let mode="title";
let movesLeft=MOVE_LIMIT;

const barFill=document.getElementById("barFill");
const dialogue=document.getElementById("dialogue");
const d1=document.getElementById("dLine1");
const d2=document.getElementById("dLine2");
const puzzleOverlay=document.getElementById("puzzleOverlay");
const grid=document.getElementById("grid");
const movesText=document.getElementById("movesText");
const rPrompt=document.getElementById("rickshawPrompt");

const FRUITS=["🍇","🍎","🍌","🍓","🍊","🍉","🍍","🥝"];
let deck=[];
let first=null,second=null,lock=false;

function startIntro(){
mode="dialogue";
dialogue.style.display="block";
d1.textContent="Nuri: Let’s take rickshaw!";
d2.textContent="Sadith: Only if you win 😈";
}

function buildDeck(){
let cards=[...FRUITS,...FRUITS];
cards.sort(()=>Math.random()-0.5);
deck=cards.map((f,i)=>({id:i,fruit:f,up:false,matched:false}));
}

function renderGrid(){
grid.innerHTML="";
deck.forEach((card,i)=>{
let btn=document.createElement("button");
btn.className="tile";
btn.textContent=card.up||card.matched?card.fruit:"❓";
btn.dataset.idx=i;
grid.appendChild(btn);
});
}

function startPuzzle(){
mode="puzzle";
puzzleOverlay.style.display="block";
movesLeft=MOVE_LIMIT;
movesText.textContent="Moves left: "+movesLeft;
buildDeck();
renderGrid();
}

grid.addEventListener("click",e=>{
let btn=e.target.closest("button.tile");
if(!btn||mode!=="puzzle"||lock)return;
let idx=+btn.dataset.idx;
let card=deck[idx];
if(card.up||card.matched)return;
card.up=true;
btn.textContent=card.fruit;
btn.classList.add("up");

if(first===null){first=idx;return;}
second=idx;
movesLeft--;
movesText.textContent="Moves left: "+movesLeft;
lock=true;

setTimeout(()=>{
let A=deck[first],B=deck[second];
if(A.fruit===B.fruit){
A.matched=B.matched=true;
if(A.fruit==="🍇")stamina=Math.min(1,stamina+GRAPE_BOOST);
}else{
A.up=B.up=false;
stamina=Math.max(0,stamina-MISMATCH_PENALTY);
}
renderGrid();
first=second=null;
lock=false;

if(deck.every(c=>c.matched)){rPrompt.style.display="block";mode="rickshaw";}
if(stamina<=0||movesLeft<=0){alert("😈 Hahaha! Now you have to walk.");location.reload();}
},450);
});

document.addEventListener("pointerdown",()=>{
if(mode==="title"){startIntro();return;}
if(mode==="dialogue"){startPuzzle();dialogue.style.display="none";return;}
if(mode==="rickshaw"){alert("Now I’ll go home and eat goru 🐄");location.reload();}
});

function loop(){
barFill.style.width=Math.round(stamina*100)+"%";
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
