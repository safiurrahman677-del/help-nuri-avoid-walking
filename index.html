<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Help Nuri Avoid Walking</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0b10">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #0b0b10;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    canvas { width: 100vw; height: 100vh; display: block; }

    /* Top-left UI container (prevents congestion) */
    .uiTop {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 10;
      pointer-events: none;
    }
    .title {
      color: rgba(255,255,255,0.96);
      font-weight: 900;
      letter-spacing: 0.2px;
      margin: 0 0 10px 0;
      line-height: 1.05;
      text-shadow: 0 6px 20px rgba(0,0,0,0.55);
    }
    .sub {
      color: rgba(255,255,255,0.55);
      font-weight: 650;
      margin-top: -6px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .staminaWrap {
      width: min(420px, 82vw);
    }
    .staminaLabel {
      color: rgba(255,255,255,0.65);
      font-size: 11px;
      font-weight: 750;
      margin-bottom: 6px;
    }
    .staminaBar {
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      overflow: hidden;
    }
    .staminaFill {
      height: 100%;
      width: 100%;
      background: rgba(255,80,80,0.92);
      border-radius: 999px;
    }

    /* Bottom hint */
    .hint {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom));
      max-width: min(520px, 92vw);
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.92);
      padding: 10px 14px;
      border-radius: 18px;
      text-align: center;
      font-size: 13px;
      font-weight: 650;
      z-index: 10;
      pointer-events: none;
    }

    /* Dialogue box */
    .dialogue {
      position: fixed;
      right: 14px;
      top: calc(120px + env(safe-area-inset-top));
      width: min(520px, 88vw);
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.95);
      border-radius: 18px;
      padding: 14px 16px;
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .d1 { font-weight: 900; font-size: 18px; margin-bottom: 8px; }
    .d2 { font-weight: 750; font-size: 16px; opacity: 0.92; }
    .d3 { margin-top: 10px; font-size: 13px; opacity: 0.65; font-weight: 650; }

    /* Mobile sizing tweaks */
    @media (max-width: 520px) {
      .title { font-size: 30px; }
      .dialogue { top: calc(112px + env(safe-area-inset-top)); }
    }
    @media (min-width: 521px) {
      .title { font-size: 42px; }
    }
  </style>
</head>

<body>
  <div class="uiTop">
    <h1 class="title">Help Nuri Avoid Walking</h1>
    <div class="sub">Tap to advance dialogues</div>

    <div class="staminaWrap">
      <div class="staminaLabel">Stamina</div>
      <div class="staminaBar">
        <div class="staminaFill" id="staminaFill"></div>
      </div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <div class="dialogue" id="dlg" style="display:none;">
    <div class="d1" id="dlgA"></div>
    <div class="d2" id="dlgB"></div>
    <div class="d3">Tap to continue…</div>
  </div>

  <div class="hint" id="hint">
    Tap once to enable sound 🎵 • Tap to advance dialogues • Match fruits to unlock rickshaw 🚲
  </div>

<script>
(() => {
  // PWA offline
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  const staminaFill = document.getElementById("staminaFill");
  const dlg = document.getElementById("dlg");
  const dlgA = document.getElementById("dlgA");
  const dlgB = document.getElementById("dlgB");
  const hint = document.getElementById("hint");

  function resize() {
    const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  // images
  const nuriImg = new Image(); nuriImg.src = "nuri.png";
  const meImg = new Image(); meImg.src = "me.png";

  // audio
  let audioCtx = null;
  let soundEnabled = false;
  function initAudio() {
    if (soundEnabled) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      soundEnabled = true;
      sfxBlip(660,0.05,0.06);
    } catch(_) {}
  }
  function sfxBlip(freq=600, dur=0.08, vol=0.08, type="sine") {
    if (!soundEnabled || !audioCtx) return;
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfxFlip = () => sfxBlip(740,0.04,0.05);
  const sfxMatch = () => sfxBlip(920,0.07,0.07);
  const sfxMismatch = () => sfxBlip(260,0.10,0.07,"triangle");
  const sfxWin = () => { sfxBlip(523,0.08,0.09); setTimeout(()=>sfxBlip(784,0.10,0.10),120); };
  const sfxGrape = () => { sfxBlip(660,0.05,0.07); setTimeout(()=>sfxBlip(1320,0.06,0.08),70); };
  const sfxBell = () => { sfxBlip(1800,0.05,0.06); setTimeout(()=>sfxBlip(2200,0.06,0.06),70); };

  function sfxEvilLaughEcho() {
    if (!soundEnabled || !audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = "sawtooth";
    const gain = audioCtx.createGain();
    const delay = audioCtx.createDelay(1.0);
    const fb = audioCtx.createGain();
    const wet = audioCtx.createGain();
    const dry = audioCtx.createGain();

    delay.delayTime.setValueAtTime(0.18, t0);
    fb.gain.setValueAtTime(0.45, t0);
    wet.gain.setValueAtTime(0.35, t0);
    dry.gain.setValueAtTime(0.55, t0);

    delay.connect(fb); fb.connect(delay);

    osc.connect(gain);
    gain.connect(dry);
    gain.connect(delay);
    delay.connect(wet);

    dry.connect(audioCtx.destination);
    wet.connect(audioCtx.destination);

    osc.frequency.setValueAtTime(280, t0);
    osc.frequency.exponentialRampToValueAtTime(210, t0 + 0.12);
    osc.frequency.setValueAtTime(320, t0 + 0.20);
    osc.frequency.exponentialRampToValueAtTime(240, t0 + 0.55);

    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.10, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.65);

    osc.start(t0);
    osc.stop(t0 + 0.70);
  }

  // helpers
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

  function roundedRect(x,y,w,h,r){
    r = Math.max(0, Math.min(r, Math.min(w,h)/2));
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function sheetInfo(img){
    const fw = img.width / 3;
    const fh = img.height;
    return { fw, fh };
  }

  function drawSprite(img, frameIndex, x, y, w, h){
    if (!img.complete || !img.naturalWidth) return;
    const { fw, fh } = sheetInfo(img);
    const sx = frameIndex * fw;
    ctx.drawImage(img, sx, 0, fw, fh, x, y, w, h);
  }

  // Dialogue system (tap-to-advance)
  const dialogue = { active:false, queue:[], a:"", b:"" };
  function setDialogue(lines){
    dialogue.queue = lines.slice();
    dialogue.active = true;
    nextDialogue();
  }
  function nextDialogue(){
    if (dialogue.queue.length === 0){
      dialogue.active = false;
      dlg.style.display = "none";
      return;
    }
    const d = dialogue.queue.shift();
    dialogue.a = d.a; dialogue.b = d.b;
    dlgA.textContent = dialogue.a;
    dlgB.textContent = dialogue.b;
    dlg.style.display = "block";
  }

  // Puzzle (4x3)
  const FRUITS = [
    { key:"grape", emoji:"🍇" },
    { key:"apple", emoji:"🍎" },
    { key:"banana", emoji:"🍌" },
    { key:"watermelon", emoji:"🍉" },
    { key:"strawberry", emoji:"🍓" },
    { key:"orange", emoji:"🍊" },
  ];

  function makeDeck(){
    const cards = [];
    for (const f of FRUITS) { cards.push({fruit:f},{fruit:f}); }
    for (let i = cards.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    return cards.map((c,idx)=>({ id:idx, fruit:c.fruit, faceUp:false, matched:false }));
  }

  // Game constants
  const WALK_TIME_SECONDS = 30;
  const MOVE_LIMIT = 14;
  const MISMATCH_STAMINA_PENALTY = 0.10;
  const GRAPE_STAMINA_BOOST = 0.06;

  // State
  const state = {
    mode: "introTitle", // introTitle -> introTalk -> walking -> puzzle -> rickshaw -> win -> lose
    stamina: 1,
    walkT: 0,

    rickshawUnlocked: false,
    bellPlayed: false,

    evilMode: false,
    evilUntil: 0,

    puzzle: {
      active:false,
      movesLeft: MOVE_LIMIT,
      deck: makeDeck(),
      first:null,
      second:null,
      lock:false,
      solved:false,
    }
  };

  function resetAll(){
    state.mode = "introTitle";
    state.stamina = 1;
    state.walkT = 0;
    state.rickshawUnlocked = false;
    state.bellPlayed = false;
    state.evilMode = false;
    state.evilUntil = 0;

    state.puzzle.active = false;
    state.puzzle.movesLeft = MOVE_LIMIT;
    state.puzzle.deck = makeDeck();
    state.puzzle.first = null;
    state.puzzle.second = null;
    state.puzzle.lock = false;
    state.puzzle.solved = false;

    dlg.style.display = "none";
    hint.style.display = "block";
  }

  resetAll();

  function startIntro(){
    state.mode = "introTalk";
    setDialogue([
      { a:"Nuri: How far is it?", b:"Sadith: Very near 😌" },
      { a:"Nuri: I don’t want to walk…", b:"Sadith: Okay okay 😅" },
      { a:"Nuri: Let’s take rickshaw!", b:"Sadith: You have to win 😈" },
    ]);
  }

  // puzzle layout
  function puzzleLayout(){
    const W = innerWidth, H = innerHeight;
    const panelW = Math.min(640, W*0.94);
    const panelH = Math.min(560, H*0.52);
    const x = (W - panelW)/2;
    const y = Math.max(160, H*0.26);
    const cols=4, rows=3;
    const gap = W < 520 ? 10 : 12;
    const cellW = (panelW - gap*(cols+1)) / cols;
    const cellH = (panelH - gap*(rows+1)) / rows;
    return {x,y,panelW,panelH,cols,rows,gap,cellW,cellH};
  }

  function cardAt(px,py){
    const L = puzzleLayout();
    for (let i=0;i<state.puzzle.deck.length;i++){
      const col = i % L.cols;
      const row = Math.floor(i/L.cols);
      const cx = L.x + L.gap + col*(L.cellW+L.gap);
      const cy = L.y + L.gap + row*(L.cellH+L.gap);
      if (px>=cx && px<=cx+L.cellW && py>=cy && py<=cy+L.cellH) return i;
    }
    return null;
  }

  function handlePuzzleTap(px,py){
    const p = state.puzzle;
    if (p.lock) return;
    const idx = cardAt(px,py);
    if (idx===null) return;

    const c = p.deck[idx];
    if (c.matched || c.faceUp) return;

    c.faceUp = true;
    sfxFlip();

    if (p.first === null) { p.first = idx; return; }
    if (p.second === null) {
      p.second = idx;
      p.movesLeft -= 1;
      p.lock = true;

      setTimeout(() => {
        const a = p.deck[p.first];
        const b = p.deck[p.second];
        const match = a.fruit.key === b.fruit.key;

        if (match) {
          a.matched = true; b.matched = true;
          a.faceUp = false; b.faceUp = false;
          sfxMatch();

          if (a.fruit.key === "grape") {
            state.stamina = clamp(state.stamina + GRAPE_STAMINA_BOOST, 0, 1);
            sfxGrape();
          }

          if (p.deck.every(x=>x.matched)) {
            p.solved = true;
            state.rickshawUnlocked = true;
            state.mode = "rickshaw";

            if (!state.bellPlayed) {
              sfxBell();
              state.bellPlayed = true;
            }
          }
        } else {
          a.faceUp = false; b.faceUp = false;
          state.stamina = clamp(state.stamina - MISMATCH_STAMINA_PENALTY, 0, 1);
          sfxMismatch();
        }

        p.first = null;
        p.second = null;
        p.lock = false;

        if (!p.solved && (p.movesLeft <= 0 || state.stamina <= 0)) {
          loseNow();
        }
      }, 420);
    }
  }

  function loseNow(){
    state.mode = "lose";
    state.evilMode = true;
    state.evilUntil = performance.now() + 3500;
    sfxEvilLaughEcho();
    setDialogue([
      { a:"Sadith: Hahaha 😈", b:"" },
      { a:"Sadith: Now you have to walk.", b:"" }
    ]);
  }

  // tap logic
  canvas.addEventListener("pointerdown", (e) => {
    initAudio();

    if (state.mode === "introTitle") { startIntro(); return; }

    if (dialogue.active) {
      nextDialogue();
      if (!dialogue.active && state.mode === "introTalk") state.mode = "walking";
      return;
    }

    if (state.mode === "rickshaw") {
      state.mode = "win";
      setDialogue([
        { a:"Sadith: You won the game!", b:"Now take rickshaw 😌" },
        { a:"Nuri: Now I’ll go home", b:"and eat goru." }
      ]);
      sfxWin();
      return;
    }

    if (state.mode === "win" || state.mode === "lose") {
      resetAll();
      return;
    }

    if (state.mode === "puzzle") {
      const r = canvas.getBoundingClientRect();
      const px = e.clientX - r.left;
      const py = e.clientY - r.top;
      handlePuzzleTap(px,py);
      return;
    }
  });

  // drawing pieces
  function drawBackground(){
    const W = innerWidth, H = innerHeight;
    ctx.fillStyle = "#0b0b10";
    ctx.fillRect(0,0,W,H);

    // soft circle light
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.beginPath();
    ctx.arc(W*0.78, H*0.25, Math.min(W,H)*0.30, 0, Math.PI*2);
    ctx.fill();

    // road
    const roadY = H*0.72;
    ctx.fillStyle = "#1b1b22";
    ctx.fillRect(0, roadY, W, H-roadY);

    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.fillRect(0, roadY-26, W, 26);

    // lane dashes
    const speed = 170;
    const t = (state.mode==="walking"||state.mode==="puzzle"||state.mode==="rickshaw"||state.mode==="win"||state.mode==="lose") ? state.walkT : 0;
    const off = (t*speed)%92;
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    for (let x=-off; x<W; x+=92) ctx.fillRect(x, roadY + (H-roadY)*0.36, 48, 6);

    // simple gate (right)
    const gateX = W*0.76, gateY = roadY - 170, gateW = W*0.20, gateH = 170;
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    roundedRect(gateX, gateY, gateW*0.22, gateH, 16); ctx.fill();
    roundedRect(gateX+gateW*0.78, gateY, gateW*0.22, gateH, 16); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    roundedRect(gateX+gateW*0.12, gateY, gateW*0.76, 48, 16); ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.font = "800 13px system-ui";
    ctx.fillText("Welcome to", gateX+gateW*0.16, gateY+20);
    ctx.font = "900 13px system-ui";
    ctx.fillText("United International University", gateX+gateW*0.16, gateY+38);
  }

  function drawCharacters(){
    const W = innerWidth, H = innerHeight;
    const roadY = H*0.72;

    const isMobile = W < 520;
    const scaleN = isMobile ? 0.82 : 1.00;
    const scaleM = isMobile ? 0.78 : 0.95;

    // Nuri position (left)
    if (nuriImg.complete && nuriImg.naturalWidth) {
      const {fw,fh} = sheetInfo(nuriImg);
      let frame = 0;
      if (state.mode==="win") frame = 2;
      else if (state.stamina <= 0.35) frame = 1;

      const drawH = Math.min(H*0.60, fh*0.55) * scaleN;
      const drawW = (fw/fh) * drawH;

      const x = W * 0.30 - drawW/2;
      const y = roadY - drawH;
      drawSprite(nuriImg, frame, x, y, drawW, drawH);
    }

    // Sadith position (right)
    if (meImg.complete && meImg.naturalWidth) {
      const {fw,fh} = sheetInfo(meImg);
      let frame = 0;
      if (state.evilMode || state.mode==="lose") frame = 2;
      else if (state.mode==="introTalk" || dialogue.active) frame = 1;

      const drawH = Math.min(H*0.54, fh*0.50) * scaleM;
      const drawW = (fw/fh) * drawH;

      const x = W * 0.72 - drawW/2;
      const y = roadY - drawH;
      drawSprite(meImg, frame, x, y, drawW, drawH);

      // red eyes + aura when evil
      if (state.evilMode) {
        const now = performance.now();
        if (state.evilUntil && now > state.evilUntil && state.mode!=="lose") state.evilMode = false;

        // dark aura overlay
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(0,0,W,H);
        ctx.globalCompositeOperation = "lighter";
        const pulse = 0.5 + 0.5*Math.sin(now/140);
        const grd = ctx.createRadialGradient(W*0.72, H*0.36, 40, W*0.72, H*0.36, Math.max(W,H)*0.7);
        grd.addColorStop(0, "rgba(255,0,0,0)");
        grd.addColorStop(0.75, `rgba(255,0,0,${0.08+0.07*pulse})`);
        grd.addColorStop(1, `rgba(255,0,0,${0.14+0.10*pulse})`);
        ctx.fillStyle = grd;
        ctx.fillRect(0,0,W,H);
        ctx.restore();

        // glowing eyes (approx)
        const ex1 = x + drawW*0.58, ey1 = y + drawH*0.28;
        const ex2 = x + drawW*0.70, ey2 = y + drawH*0.28;
        const glow = Math.max(10, drawW*0.05) * (0.9 + 0.3*pulse);

        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        function eye(px,py){
          const g = ctx.createRadialGradient(px,py,0,px,py,glow*2.8);
          g.addColorStop(0, `rgba(255,0,0,${0.6+0.25*pulse})`);
          g.addColorStop(0.35, `rgba(255,0,0,${0.25+0.10*pulse})`);
          g.addColorStop(1, "rgba(255,0,0,0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(px,py,glow*2.8,0,Math.PI*2); ctx.fill();
          ctx.fillStyle = "rgba(255,60,60,0.9)";
          ctx.beginPath(); ctx.arc(px,py,glow*0.55,0,Math.PI*2); ctx.fill();
        }
        eye(ex1,ey1); eye(ex2,ey2);
        ctx.restore();
      }
    }
  }

  function drawRickshaw(){
    const W = innerWidth, H = innerHeight;
    const roadY = H*0.72;
    const x = W*0.78;
    const y = roadY - 12;

    ctx.save();
    ctx.translate(x,y);
    ctx.scale(1,1);

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(70,0,16,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(70,0,8,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.14)";
    roundedRect(-8,-38,95,30,10); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    roundedRect(20,-62,55,22,10); ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(84,-40);
    ctx.lineTo(110,-62);
    ctx.stroke();

    ctx.font = "900 16px system-ui";
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fillText("🔔", 96, -66);

    ctx.restore();
  }

  function drawPuzzle(){
    const W = innerWidth, H = innerHeight;
    const L = puzzleLayout();

    // overlay
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.38)";
    ctx.fillRect(0,0,W,H);

    // panel
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundedRect(L.x, L.y, L.panelW, L.panelH + 60, 22);
    ctx.fill();

    // header
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.font = "900 16px system-ui";
    ctx.fillText("Match fruits to unlock rickshaw", L.x+16, L.y+26);

    ctx.fillStyle = "rgba(255,255,255,0.80)";
    ctx.font = "750 13px system-ui";
    ctx.fillText(`Moves left: ${state.puzzle.movesLeft}`, L.x+16, L.y+48);
    ctx.fillText("🍇 gives stamina boost", L.x+170, L.y+48);

    const emojiSize = (W < 520) ? 30 : 26;

    // cards
    state.puzzle.deck.forEach((card, i) => {
      const col = i % L.cols;
      const row = Math.floor(i / L.cols);
      const x = L.x + L.gap + col*(L.cellW+L.gap);
      const y = L.y + 56 + L.gap + row*(L.cellH+L.gap);

      const up = card.faceUp || card.matched;

      ctx.fillStyle = up ? "rgba(255,255,255,0.14)" : "rgba(255,255,255,0.10)";
      roundedRect(x,y,L.cellW,L.cellH,16); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.textAlign = "center";
      if (up && !card.matched) {
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.font = `900 ${emojiSize}px system-ui`;
        ctx.fillText(card.fruit.emoji, x+L.cellW/2, y+L.cellH/2 + 10);
      } else if (!up) {
        ctx.fillStyle = "rgba(255,255,255,0.22)";
        ctx.font = "900 20px system-ui";
        ctx.fillText("?", x+L.cellW/2, y+L.cellH/2 + 7);
      }
      ctx.textAlign = "left";
    });

    ctx.restore();
  }

  function drawTitleOverlay(){
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = (innerWidth < 520) ? "900 26px system-ui" : "900 34px system-ui";
    ctx.fillText("Tap to start", 16, 140);
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.font = "650 14px system-ui";
    ctx.fillText("Tip: Install from browser menu for app-like play.", 16, 165);
    ctx.restore();
  }

  function drawRickshawPrompt(){
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.40)";
    ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = (innerWidth < 520) ? "900 24px system-ui" : "900 30px system-ui";
    ctx.fillText("Rickshaw unlocked! 🚲", 16, 150);
    ctx.fillStyle = "rgba(255,255,255,0.80)";
    ctx.font = "650 16px system-ui";
    ctx.fillText("Tap anywhere to take rickshaw", 16, 176);
    ctx.restore();
  }

  function drawEnd(text){
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.font = (innerWidth < 520) ? "900 28px system-ui" : "900 36px system-ui";
    ctx.fillText(text, 16, 150);
    ctx.fillStyle = "rgba(255,255,255,0.78)";
    ctx.font = "650 16px system-ui";
    ctx.fillText("Tap to restart", 16, 178);
    ctx.restore();
  }

  // loop
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.033, (now-last)/1000);
    last = now;

    // stamina updates only after intro
    if (state.mode === "walking") {
      state.walkT += dt;
      state.stamina = clamp(1 - (state.walkT / WALK_TIME_SECONDS), 0, 1);

      if (state.stamina <= 0.70 && !state.puzzle.active) {
        state.mode = "puzzle";
        state.puzzle.active = true;
        setDialogue([{ a:"Nuri: Let’s take rickshaw!", b:"Sadith: Win the puzzle first 😌" }]);
      }

      if (state.stamina <= 0) loseNow();
    }

    // stamina bar UI
    staminaFill.style.width = `${Math.round(state.stamina * 100)}%`;

    // draw
    drawBackground();

    // show hint only while not in puzzle/win/lose
    if (state.mode === "puzzle" || state.mode === "rickshaw") hint.style.display = "none";
    else hint.style.display = "block";

    drawCharacters();

    if (state.rickshawUnlocked && (state.mode==="rickshaw" || state.mode==="win" || state.mode==="lose")) {
      drawRickshaw();
    }

    if (state.mode === "introTitle") drawTitleOverlay();
    if (state.mode === "puzzle") drawPuzzle();
    if (state.mode === "rickshaw") drawRickshawPrompt();
    if (state.mode === "win") drawEnd("YOU WIN 🎉");
    if (state.mode === "lose") drawEnd("YOU LOST 😭");

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
