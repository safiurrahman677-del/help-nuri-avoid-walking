<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Help Nuri Avoid Walking</title>

  <style>
    :root{
      --bg:#0b0b10;
      --panel: rgba(0,0,0,.62);
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.70);
      --danger: rgba(255,80,80,.95);
      --barbg: rgba(255,255,255,.14);
      --card: rgba(255,255,255,.10);
      --cardUp: rgba(255,255,255,.16);
      --stroke: rgba(255,255,255,.18);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }

    #stage{
      position:fixed; inset:0;
      background: radial-gradient(circle at 78% 18%, rgba(255,255,255,.06) 0 28vmin, transparent 29vmin),
                  linear-gradient(#0b0b10, #0b0b10);
    }

    /* ROAD */
    #road{
      position:absolute; left:0; right:0; bottom:0;
      height: 26vh;
      background: #1b1b22;
      border-top: 22px solid rgba(255,255,255,.08);
      overflow:hidden;
    }
    #dashes{
      position:absolute; left:0; right:0;
      top: 46%;
      height: 6px;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 52px, transparent 52px 98px);
      opacity:.9;
      transform: translateX(0);
    }

    /* TOP UI: always clean on phone */
    #uiTop{
      position:fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 50;
      pointer-events:none;
      display:flex;
      flex-direction:column;
      gap: 10px;
      align-items:flex-start;
    }

    #title{
      color:var(--text);
      font-weight: 950;
      letter-spacing:.2px;
      line-height:1.05;
      font-size: clamp(22px, 6.2vw, 42px);
      text-shadow: 0 10px 30px rgba(0,0,0,.55);
      margin:0;
    }

    #barWrap{
      width: min(520px, 92vw);
    }
    #barLabel{ color:var(--muted); font-weight:900; font-size:12px; margin:0 0 6px 0; }
    #bar{
      height: 12px;
      background: var(--barbg);
      border-radius: 999px;
      overflow:hidden;
    }
    #barFill{
      height:100%;
      width:100%;
      background: var(--danger);
      border-radius: 999px;
      transition: width .15s linear;
    }

    /* CHARACTERS */
    #chars{
      position:absolute; inset:0;
      pointer-events:none;
      z-index: 20;
    }
    .char{
      position:absolute;
      bottom: 18vh; /* above road */
      width: 38vw;  /* smaller on phone to avoid overlap */
      max-width: 230px;
      min-width: 140px;
      aspect-ratio: 1 / 1;
      filter: drop-shadow(0 18px 35px rgba(0,0,0,.55));
    }
    #nuri{ left: 6vw; }
    #sadith{ right: 6vw; }

    .sprite{
      width:100%; height:100%;
      background-repeat:no-repeat;
      background-size: 300% 100%;
      image-rendering: auto;
    }

    /* DIALOGUE: placed lower so it doesn't cover title/bar */
    #dialogue{
      position:fixed;
      left:50%;
      transform: translateX(-50%);
      top: calc(120px + env(safe-area-inset-top));
      width: min(620px, 92vw);
      background: var(--panel);
      color: var(--text);
      border-radius: 18px;
      padding: 12px 14px;
      z-index: 60;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
      display:none;
      text-align:center;
      pointer-events:none;
    }
    #dLine1{ font-weight: 950; font-size: 18px; }
    #dLine2{ margin-top: 8px; font-weight: 850; font-size: 16px; color: rgba(255,255,255,.88); }
    #dHint{ margin-top: 10px; font-size: 12px; font-weight: 800; color: rgba(255,255,255,.60); }

    /* BOTTOM HINT: smaller and higher so it doesn't cover road */
    #hint{
      position:fixed;
      left:50%;
      transform: translateX(-50%);
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: min(560px, 92vw);
      background: rgba(0,0,0,.55);
      color: rgba(255,255,255,.92);
      border-radius: 18px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 800;
      text-align:center;
      z-index: 55;
      pointer-events:none;
      line-height:1.25;
    }

    /* PUZZLE */
    #puzzleOverlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.45);
      z-index: 80;
      display:none;
    }
    #puzzlePanel{
      position:absolute;
      left:50%; transform:translateX(-50%);
      top: 22vh;
      width: min(520px, 94vw);
      background: rgba(0,0,0,.66);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 22px 70px rgba(0,0,0,.55);
    }
    #pTitle{ color:var(--text); font-weight: 950; font-size: 16px; }
    #pMeta{ margin-top: 6px; color: rgba(255,255,255,.78); font-weight: 850; font-size: 13px; display:flex; gap:12px; flex-wrap:wrap; }
    #grid{
      margin-top: 12px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .tile{
      appearance:none;
      border:none;
      background: var(--card);
      border: 2px solid var(--stroke);
      border-radius: 16px;
      height: 62px;
      font-size: 28px;
      font-weight: 950;
      color: rgba(255,255,255,.95);
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      touch-action: manipulation;
    }
    .tile.up{ background: var(--cardUp); }
    .tile.matched{
      background: rgba(120,255,160,.14);
      border-color: rgba(120,255,160,.22);
      opacity: .95;
    }

    /* RICKSHAW PROMPT */
    #rickshawPrompt{
      position:fixed; inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      z-index: 85;
    }
    #rBox{
      position:absolute; left:50%; transform:translateX(-50%);
      top: 30vh;
      width: min(520px, 92vw);
      background: rgba(0,0,0,.70);
      color: var(--text);
      border-radius: 22px;
      padding: 16px;
      text-align:center;
      box-shadow: 0 22px 70px rgba(0,0,0,.55);
    }
    #rBox .h{ font-size: 20px; font-weight: 950; }
    #rBox .s{ margin-top: 8px; color: rgba(255,255,255,.82); font-weight: 850; }

    /* EVIL EFFECT (lose) */
    #evil{
      position:fixed; inset:0;
      display:none;
      z-index: 90;
      pointer-events:none;
      background: radial-gradient(circle at 70% 30%, rgba(255,0,0,.14), transparent 55%),
                  rgba(0,0,0,.38);
    }
    #sadith.evil{
      filter: drop-shadow(0 18px 35px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(255,0,0,.55));
    }

    /* EXTRA SMALL PHONE TUNING */
    @media (max-width: 380px){
      .char{ width: 36vw; }
      #dialogue{ top: calc(112px + env(safe-area-inset-top)); }
      .tile{ height: 58px; font-size: 26px; }
    }
    @media (max-height: 700px){
      #dialogue{ top: calc(110px + env(safe-area-inset-top)); }
      #puzzlePanel{ top: 18vh; }
    }
  </style>
</head>

<body>
  <div id="stage">
    <div id="chars">
      <div class="char" id="nuri"><div class="sprite" id="nuriSprite"></div></div>
      <div class="char" id="sadith"><div class="sprite" id="sadithSprite"></div></div>
    </div>
    <div id="road"><div id="dashes"></div></div>
  </div>

  <div id="uiTop">
    <div id="title">Help Nuri Avoid Walking</div>
    <div id="barWrap">
      <div id="barLabel">Stamina</div>
      <div id="bar"><div id="barFill"></div></div>
    </div>
  </div>

  <div id="dialogue">
    <div id="dLine1"></div>
    <div id="dLine2"></div>
    <div id="dHint">Tap anywhere to continue…</div>
  </div>

  <div id="hint">Tap once to enable sound 🎵 • Tap to advance dialogues • Match fruits to unlock rickshaw 🚲</div>

  <div id="puzzleOverlay">
    <div id="puzzlePanel">
      <div id="pTitle">Match fruits to unlock rickshaw 🚲</div>
      <div id="pMeta">
        <div id="movesText">Moves left: 16</div>
        <div>🍇 gives stamina boost</div>
      </div>
      <div id="grid"></div>
    </div>
  </div>

  <div id="rickshawPrompt">
    <div id="rBox">
      <div class="h">Rickshaw unlocked! 🔔🚲</div>
      <div class="s">Tap anywhere to take rickshaw</div>
    </div>
  </div>

  <div id="evil"></div>

<script>
(() => {
  // ===== Slightly easier settings =====
  const WALK_SECONDS = 30;
  const START_PUZZLE_AT = 0.72;
  const MOVE_LIMIT = 16;          // easier
  const MISMATCH_PENALTY = 0.08;  // easier
  const GRAPE_BOOST = 0.08;       // easier

  const barFill = document.getElementById("barFill");
  const dialogue = document.getElementById("dialogue");
  const d1 = document.getElementById("dLine1");
  const d2 = document.getElementById("dLine2");
  const hint = document.getElementById("hint");
  const puzzleOverlay = document.getElementById("puzzleOverlay");
  const grid = document.getElementById("grid");
  const movesText = document.getElementById("movesText");
  const rPrompt = document.getElementById("rickshawPrompt");
  const evil = document.getElementById("evil");

  const nuriSprite = document.getElementById("nuriSprite");
  const sadithSprite = document.getElementById("sadithSprite");
  const sadithChar = document.getElementById("sadith");

  nuriSprite.style.backgroundImage = "url('nuri.png')";
  sadithSprite.style.backgroundImage = "url('me.png')";

  function setSpriteFrame(which, i){
    which.style.backgroundPosition = (-i*100) + "% 0%";
  }

  // AUDIO (tiny)
  let audioCtx=null, soundEnabled=false;
  function ensureAudio(){
    if(soundEnabled) return;
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); soundEnabled=true; }catch(e){}
  }
  function blip(freq=600, dur=0.08, vol=0.07, type="sine"){
    if(!soundEnabled||!audioCtx) return;
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  const sFlip=()=>blip(740,0.05,0.06);
  const sMatch=()=>blip(980,0.08,0.08);
  const sMismatch=()=>blip(240,0.12,0.08,"triangle");
  const sBell=()=>{ blip(1800,0.05,0.06); setTimeout(()=>blip(2200,0.06,0.06),70); };
  const sWin=()=>{ blip(523,0.08,0.09); setTimeout(()=>blip(784,0.12,0.10),120); };
  function evilLaughEcho(){
    if(!soundEnabled||!audioCtx) return;
    const t0=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    osc.type="sawtooth";
    const gain=audioCtx.createGain();
    const delay=audioCtx.createDelay(1.0);
    const fb=audioCtx.createGain();
    delay.delayTime.setValueAtTime(0.18,t0);
    fb.gain.setValueAtTime(0.45,t0);
    delay.connect(fb); fb.connect(delay);
    osc.connect(gain); gain.connect(audioCtx.destination);
    gain.connect(delay); delay.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(280,t0);
    osc.frequency.exponentialRampToValueAtTime(210,t0+0.12);
    osc.frequency.setValueAtTime(320,t0+0.20);
    osc.frequency.exponentialRampToValueAtTime(240,t0+0.55);
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.exponentialRampToValueAtTime(0.12,t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+0.65);
    osc.start(t0); osc.stop(t0+0.70);
  }

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  let mode="title";
  let stamina=1;
  let walkT=0;

  // dialogue
  let dialogueQueue=[];
  let dialogueActive=false;
  function setDialogue(lines){
    dialogueQueue=lines.slice();
    dialogueActive=true;
    showNextDialogue();
  }
  function showNextDialogue(){
    if(dialogueQueue.length===0){
      dialogueActive=false;
      dialogue.style.display="none";
      return;
    }
    const cur=dialogueQueue.shift();
    d1.textContent=cur.a;
    d2.textContent=cur.b;
    dialogue.style.display="block";
  }

  // road
  const dashes=document.getElementById("dashes");
  let dashX=0;

  // puzzle
  const FRUITS=[
    {k:"grape", e:"🍇"},
    {k:"apple", e:"🍎"},
    {k:"banana", e:"🍌"},
    {k:"straw", e:"🍓"},
    {k:"orange", e:"🍊"},
    {k:"water", e:"🍉"},
    {k:"pine", e:"🍍"},
    {k:"kiwi", e:"🥝"}
  ];
  let deck=[], first=null, second=null, lock=false, movesLeft=MOVE_LIMIT;

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function buildDeck(){
    const cards=[];
    for(const f of FRUITS){ cards.push({f},{f}); }
    shuffle(cards);
    deck=cards.map((c,i)=>({id:i,fruit:c.f,up:false,matched:false}));
  }
  function renderGrid(){
    grid.innerHTML="";
    deck.forEach((card,idx)=>{
      const btn=document.createElement("button");
      btn.className="tile";
      btn.type="button";
      btn.dataset.idx=idx;
      btn.textContent=(card.up||card.matched)?card.fruit.e:"❓";
      if(card.up) btn.classList.add("up");
      if(card.matched) btn.classList.add("matched");
      grid.appendChild(btn);
    });
  }

  function startPuzzle(){
    mode="puzzle";
    hint.style.display="none";
    puzzleOverlay.style.display="block";
    movesLeft=MOVE_LIMIT;
    movesText.textContent="Moves left: "+movesLeft;
    first=null; second=null; lock=false;
    buildDeck();
    renderGrid();
    setSpriteFrame(nuriSprite,1); // tired
    setSpriteFrame(sadithSprite,0);
  }

  function loseNow(){
    mode="lose";
    puzzleOverlay.style.display="none";
    rPrompt.style.display="none";
    evil.style.display="block";
    sadithChar.classList.add("evil");
    setSpriteFrame(sadithSprite,2);
    evilLaughEcho();
    setDialogue([
      {a:"Sadith: Hahaha 😈", b:""},
      {a:"Sadith: Now you have to walk.", b:""}
    ]);
  }

  function winNow(){
    mode="rickshaw";
    puzzleOverlay.style.display="none";
    sBell();
    rPrompt.style.display="block";
    setSpriteFrame(nuriSprite,2);
    setSpriteFrame(sadithSprite,1);
  }

  grid.addEventListener("click",(e)=>{
    const btn=e.target.closest("button.tile");
    if(!btn||mode!=="puzzle"||lock) return;

    ensureAudio();
    const idx=Number(btn.dataset.idx);
    const c=deck[idx];
    if(c.matched||c.up) return;

    sFlip();
    c.up=true; renderGrid();

    if(first===null){ first=idx; return; }
    second=idx; movesLeft--; movesText.textContent="Moves left: "+movesLeft; lock=true;

    setTimeout(()=>{
      const A=deck[first], B=deck[second];
      if(A.fruit.k===B.fruit.k){
        A.matched=true; B.matched=true;
        A.up=false; B.up=false;
        sMatch();
        if(A.fruit.k==="grape") stamina=clamp(stamina+GRAPE_BOOST,0,1);
        if(deck.every(x=>x.matched)){ sWin(); winNow(); }
      }else{
        A.up=false; B.up=false;
        sMismatch();
        stamina=clamp(stamina-MISMATCH_PENALTY,0,1);
        if(stamina<=0||movesLeft<=0) loseNow();
      }
      first=null; second=null; lock=false;
      renderGrid();
    },420);
  });

  function startIntro(){
    mode="dialogue";
    setDialogue([
      {a:"Nuri: How far is it?", b:"Sadith: Very near 😌"},
      {a:"Nuri: I don’t want to walk…", b:"Sadith: Okay okay 😅"},
      {a:"Nuri: Let’s take rickshaw!", b:"Sadith: Only if you win 😈"}
    ]);
    setSpriteFrame(sadithSprite,1);
  }

  document.addEventListener("pointerdown",()=>{
    ensureAudio();

    if(mode==="title"){ startIntro(); return; }

    if(dialogueActive){
      showNextDialogue();
      if(!dialogueActive && mode==="dialogue"){
        mode="walking";
        setSpriteFrame(sadithSprite,0);
        setSpriteFrame(nuriSprite,0);
      }
      return;
    }

    if(mode==="rickshaw"){
      rPrompt.style.display="none";
      mode="win";
      setDialogue([
        {a:"Sadith: You won the game!", b:"Now take rickshaw 😌"},
        {a:"Nuri: Now I’ll go home", b:"and eat goru."}
      ]);
      return;
    }

    if(mode==="win" || mode==="lose"){
      location.reload();
      return;
    }
  }, {passive:true});

  function loop(){
    if(mode==="walking"){
      walkT += 1/60;
      stamina = clamp(1 - (walkT / WALK_SECONDS), 0, 1);
      if(stamina <= 0.40) setSpriteFrame(nuriSprite,1);
      if(stamina <= START_PUZZLE_AT) startPuzzle();
      if(stamina <= 0) loseNow();
    }

    dashX = (dashX - 3) % 98;
    dashes.style.transform = `translateX(${dashX}px)`;
    barFill.style.width = Math.round(stamina*100) + "%";

    requestAnimationFrame(loop);
  }

  // start
  setSpriteFrame(nuriSprite,0);
  setSpriteFrame(sadithSprite,0);

  dialogue.style.display="block";
  d1.textContent="Tap to start";
  d2.textContent="Help Nuri avoid walking 😌";
  mode="title";

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
